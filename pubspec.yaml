name: awady_music
description: "Awady Music Flutter app."
publish_to: 'none'

version: 1.0.5+5

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  google_fonts: ^9.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  lucide_icons_flutter: ^4.0.2
  palette_generator: ^0.3.3+7
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.6.0+eol
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
